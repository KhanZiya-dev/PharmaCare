services:
  - type: web
    name: pharmacare-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && playwright install chromium"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
